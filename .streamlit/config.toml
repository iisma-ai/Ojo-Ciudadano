# Identidad visual de Ojo Ciudadano (docs/marca.md). Fondo oscuro, azul como acento.

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#3D8BFD"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#131C2E"
textColor = "#E7ECF3"
linkColor = "#7DB3FF"
borderColor = "#24314A"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono', ui-monospace, monospace"

[theme.sidebar]
backgroundColor = "#0E1626"
secondaryBackgroundColor = "#131C2E"
