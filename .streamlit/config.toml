# Identidad visual de Ojo Ciudadano (docs/marca.md). Fondo oscuro, azul como acento.

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#3D8BFD"
backgroundColor = "#041627"
secondaryBackgroundColor = "#0B2236"
textColor = "#E7ECF3"
linkColor = "#7DB3FF"
borderColor = "#1E3A52"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono', ui-monospace, monospace"

[theme.sidebar]
backgroundColor = "#06202F"
secondaryBackgroundColor = "#0B2236"
