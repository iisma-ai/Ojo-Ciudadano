[project]
name = "ojo-ciudadano"
version = "0.1.0"
description = "Plataforma de transparencia del gasto público de la Comunidad de Madrid: sigue el dinero de cada órgano a cada empresa, calcula indicadores de riesgo y permite investigarlo en lenguaje natural."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "pyarrow>=17",
    "lxml>=5.3",
    "httpx>=0.27",
    "streamlit>=1.40",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "fastexcel>=0.21.0",
    "streamlit-searchbox>=0.1.24",
]

# Las dependencias del asistente (cliente LLM, embeddings, índice híbrido)
# se añadirán cuando se cierre la decisión D-010 en docs/decisions.md.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
# El equipo trabaja en Windows, Linux y macOS: el lock debe tener wheels para todos.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ojo_ciudadano"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Los tests llevan filas CSV y XML sintéticas que no conviene partir.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
