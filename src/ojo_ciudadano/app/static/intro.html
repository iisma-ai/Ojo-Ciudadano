<!-- Entrada de la web (D-043): 3 s, solo la primera vez en la sesión.
     Mar muy oscuro; aparece el ojo de cristal de la presentación (iris de luz que gira despacio,
     pupila oscura y bola de vidrio), se enciende y su luz aclara el mar hasta desvelar la página
     (escenas 2 y 3 de la presentación). Las capas del ojo las dibuja app/ojo_cristal.py.
     Solo se animan opacity y transform (los mueve la tarjeta gráfica, sin repintar) y no
     bloquea los clics. Con «reducir movimiento» no se muestra. -->
<style>
.oc-intro { position: fixed; inset: 0; z-index: 1000000; pointer-events: none;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  background: radial-gradient(90% 70% at 50% 42%, #04192b 0%, #020b16 55%, #01050b 100%);
  animation: oc-intro-fuera 3s cubic-bezier(.4, 0, .2, 1) forwards; }
@keyframes oc-intro-fuera {
  0%, 62% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; } }

/* luz que nace del ojo y se abre por todo el mar */
.oc-intro-luz { position: absolute; inset: -25%; will-change: transform, opacity;
  /* círculo con caída suave (sin borde marcado), sea cual sea la forma de la pantalla */
  background:
    radial-gradient(circle at 50% 45%, rgba(175, 230, 255, .62) 0, rgba(120, 190, 255, .42) 7vmax,
      rgba(80, 160, 250, .24) 15vmax, rgba(56, 150, 240, .11) 24vmax,
      rgba(40, 120, 220, .04) 33vmax, transparent 42vmax),
    radial-gradient(70% 50% at 50% -8%, rgba(170, 235, 255, .28), transparent 70%);
  opacity: 0; transform: scale(.5);
  animation: oc-intro-luz 3s cubic-bezier(.3, 0, .2, 1) forwards; }
@keyframes oc-intro-luz {
  0%, 24% { opacity: 0; transform: scale(.5); }
  55% { opacity: 1; transform: scale(1.1); }
  100% { opacity: .9; transform: scale(2.6); } }

/* nieve marina: puntos que suben despacio */
.oc-intro-nieve { position: absolute; inset: -10% 0; will-change: transform, opacity;
  background-image:
    radial-gradient(circle, rgba(200, 235, 255, .55) 0 1px, transparent 1.5px),
    radial-gradient(circle, rgba(200, 235, 255, .35) 0 1.5px, transparent 2px);
  background-size: 140px 160px, 230px 260px; background-position: 30px 10px, 110px 80px;
  opacity: 0; animation: oc-intro-nieve 3s ease-out forwards; }
@keyframes oc-intro-nieve {
  0% { opacity: 0; transform: translateY(40px); }
  30% { opacity: .8; }
  100% { opacity: 0; transform: translateY(-90px); } }

/* el ojo de cristal: halo, iris que gira y bola de vidrio encima */
.oc-intro-ojo { position: relative; width: 190px; height: 190px; will-change: transform, opacity;
  opacity: 0; transform: scale(.82) translateY(12px);
  animation: oc-intro-ojo 3s cubic-bezier(.2, .7, .2, 1) forwards; }
.oc-intro-ojo > * { position: absolute; inset: 0; width: 100%; height: 100%; }
.oc-intro-bola { border-radius: 50%;
  background: radial-gradient(circle at 50% 55%, #0b2a4d 0%, #061a30 60%, #030d1a 100%);
  box-shadow: 0 0 70px rgba(61, 139, 253, .45), 0 0 140px rgba(56, 189, 248, .22); }
.oc-intro-halo { inset: -45%; width: 190%; height: 190%; border-radius: 50%;
  background: radial-gradient(circle, rgba(140, 200, 255, .55) 0%, rgba(61, 139, 253, .25) 35%,
    transparent 65%);
  opacity: 0; will-change: transform, opacity;
  animation: oc-intro-halo 3s ease-in-out forwards; }
.oc-intro-iris { will-change: transform; animation: oc-intro-gira 3s linear forwards; }
@keyframes oc-intro-ojo {
  0% { opacity: 0; transform: scale(.82) translateY(12px); }
  28% { opacity: 1; transform: scale(1) translateY(0); }
  70% { opacity: 1; transform: scale(1.05); }
  100% { opacity: 0; transform: scale(1.3); } }
@keyframes oc-intro-gira {
  from { transform: rotate(0deg); }
  to { transform: rotate(50deg); } }
@keyframes oc-intro-halo {
  0%, 20% { opacity: 0; transform: scale(.6); }
  50% { opacity: 1; transform: scale(1); }
  80% { opacity: .8; transform: scale(1.25); }
  100% { opacity: 0; transform: scale(1.5); } }

/* la pupila se enciende: un destello suave que se abre */
.oc-intro-destello { inset: auto; left: 50%; top: 50%; width: 60px; height: 60px;
  margin: -30px 0 0 -30px; border-radius: 50%; will-change: transform, opacity;
  background: radial-gradient(circle, rgba(215, 242, 255, .95), rgba(110, 175, 255, .5) 40%,
    transparent 70%);
  opacity: 0; transform: scale(.2);
  animation: oc-intro-destello 3s ease-out forwards; }
@keyframes oc-intro-destello {
  0%, 28% { opacity: 0; transform: scale(.2); }
  46% { opacity: .95; transform: scale(1.7); }
  78% { opacity: 0; transform: scale(4.5); }
  100% { opacity: 0; transform: scale(4.5); } }

.oc-intro-nombre { position: relative; margin-top: 26px; font-family: Inter, sans-serif;
  font-size: 1.05rem; letter-spacing: .32em; text-transform: uppercase; color: #cfe9ff;
  opacity: 0; transform: translateY(8px); will-change: transform, opacity;
  animation: oc-intro-nombre 3s ease-out forwards; }
@keyframes oc-intro-nombre {
  0%, 28% { opacity: 0; transform: translateY(8px); }
  48%, 74% { opacity: .9; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-6px); } }

/* La página no se anima por separado: la capa va dentro de ella y un transform en la página
   haría que la capa fija dejara de cubrir la pantalla. Se desvela al desvanecerse la capa. */
@media (prefers-reduced-motion: reduce) {
  .oc-intro { display: none; } }
</style>
<div class="oc-intro" aria-hidden="true">
  <div class="oc-intro-luz"></div>
  <div class="oc-intro-nieve"></div>
  <div class="oc-intro-ojo">
    <div class="oc-intro-halo"></div>
    <div class="oc-intro-bola"></div>
    <img class="oc-intro-iris" src="{iris}" alt="">
    <img src="{cristal}" alt="">
    <div class="oc-intro-destello"></div>
  </div>
  <div class="oc-intro-nombre">Ojo Ciudadano</div>
</div>
