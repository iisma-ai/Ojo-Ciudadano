<!-- Entrada de la web (D-043): 1,5 s, solo la primera vez en la sesión.
     Mar muy oscuro; el ojo de cristal aparece, se le enciende la pupila y su luz aclara el mar
     hasta desvelar la página (inspirada en las escenas 2 y 3 de la presentación).
     Solo se animan opacity y transform (los mueve la tarjeta gráfica, sin repintar) y no
     bloquea los clics. Con «reducir movimiento» no se muestra. -->
<style>
.oc-intro { position: fixed; inset: 0; z-index: 1000000; pointer-events: none;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  background: radial-gradient(90% 70% at 50% 42%, #04192b 0%, #020b16 55%, #01050b 100%);
  animation: oc-intro-fuera 1.5s cubic-bezier(.4, 0, .2, 1) forwards; }
@keyframes oc-intro-fuera {
  0%, 52% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; } }

/* luz que baja de la superficie y se abre */
.oc-intro-luz { position: absolute; inset: -20%; will-change: transform, opacity;
  background:
    radial-gradient(38% 30% at 50% 44%, rgba(125, 211, 252, .55), rgba(56, 189, 248, .16) 45%,
      transparent 70%),
    radial-gradient(60% 45% at 50% -5%, rgba(170, 235, 255, .28), transparent 70%);
  opacity: 0; transform: scale(.55);
  animation: oc-intro-luz 1.5s cubic-bezier(.3, 0, .2, 1) forwards; }
@keyframes oc-intro-luz {
  0%, 22% { opacity: 0; transform: scale(.55); }
  60% { opacity: 1; transform: scale(1.05); }
  100% { opacity: .9; transform: scale(2.2); } }

/* nieve marina: puntos que suben despacio */
.oc-intro-nieve { position: absolute; inset: -10% 0; will-change: transform, opacity;
  background-image:
    radial-gradient(circle, rgba(200, 235, 255, .55) 0 1px, transparent 1.5px),
    radial-gradient(circle, rgba(200, 235, 255, .35) 0 1.5px, transparent 2px);
  background-size: 140px 160px, 230px 260px; background-position: 30px 10px, 110px 80px;
  opacity: 0; animation: oc-intro-nieve 1.5s ease-out forwards; }
@keyframes oc-intro-nieve {
  0% { opacity: 0; transform: translateY(30px); }
  35% { opacity: .8; }
  100% { opacity: 0; transform: translateY(-60px); } }

/* el ojo de cristal */
.oc-intro-ojo { position: relative; width: 132px; height: 132px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; will-change: transform, opacity;
  background:
    radial-gradient(60% 45% at 34% 26%, rgba(255, 255, 255, .42), rgba(255, 255, 255, 0) 60%),
    radial-gradient(circle at 50% 60%, rgba(56, 189, 248, .18), rgba(4, 22, 39, .35) 70%);
  box-shadow: inset 0 0 0 1.5px rgba(200, 240, 255, .45), inset 0 -10px 24px rgba(56, 189, 248, .25),
    0 0 60px rgba(56, 189, 248, .35);
  opacity: 0; transform: scale(.8) translateY(10px);
  animation: oc-intro-ojo 1.5s cubic-bezier(.2, .7, .2, 1) forwards; }
.oc-intro-ojo img { width: 76px; height: 76px; }
@keyframes oc-intro-ojo {
  0% { opacity: 0; transform: scale(.8) translateY(10px); }
  35% { opacity: 1; transform: scale(1) translateY(0); }
  70% { opacity: 1; transform: scale(1.04); }
  100% { opacity: 0; transform: scale(1.35); } }

/* destello de la pupila: el ojo «enciende» la luz */
.oc-intro-destello { position: absolute; left: 41%; top: 48%; width: 40px; height: 40px;
  margin: -20px 0 0 -20px; border-radius: 50%; will-change: transform, opacity;
  background: radial-gradient(circle, rgba(190, 235, 255, .95), rgba(61, 139, 253, .5) 40%,
    transparent 70%);
  opacity: 0; transform: scale(.2);
  animation: oc-intro-destello 1.5s ease-out forwards; }
@keyframes oc-intro-destello {
  0%, 30% { opacity: 0; transform: scale(.2); }
  45% { opacity: 1; transform: scale(1.6); }
  75% { opacity: 0; transform: scale(4); }
  100% { opacity: 0; transform: scale(4); } }

.oc-intro-nombre { position: relative; margin-top: 18px; font-family: Inter, sans-serif;
  font-size: 1.05rem; letter-spacing: .32em; text-transform: uppercase; color: #cfe9ff;
  opacity: 0; transform: translateY(8px); will-change: transform, opacity;
  animation: oc-intro-nombre 1.5s ease-out forwards; }
@keyframes oc-intro-nombre {
  0%, 25% { opacity: 0; transform: translateY(8px); }
  50%, 72% { opacity: .9; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-6px); } }

/* La página no se anima por separado: la capa va dentro de ella y un transform en la página
   haría que la capa fija dejara de cubrir la pantalla. Se desvela al desvanecerse la capa. */
@media (prefers-reduced-motion: reduce) {
  .oc-intro { display: none; } }
</style>
<div class="oc-intro" aria-hidden="true">
  <div class="oc-intro-luz"></div>
  <div class="oc-intro-nieve"></div>
  <div class="oc-intro-ojo"><img src="{logo}" alt=""><div class="oc-intro-destello"></div></div>
  <div class="oc-intro-nombre">Ojo Ciudadano</div>
</div>
