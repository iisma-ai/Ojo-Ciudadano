<!-- Entrada de la web (D-043): 3 s, solo la primera vez en la sesión.
     Mar muy oscuro. El ojo 3D de la presentación (app/intro3d.py), que es la fuente de luz,
     aparece, se acerca un poco y sube alejándose hasta salir por arriba; al apartarse enciende la
     luz de su núcleo y despliega rayos que bajan sobre la página mientras el mar se aclara. Esta capa espera quieta hasta que el ojo está listo (clase «en-marcha»);
     si el 3D no carga, sale el ojo plano de app/ojo_cristal.py (clase «sin3d»). Si nada arranca,
     la capa se quita sola a los 2,5 s.
     Solo se animan opacity y transform (los mueve la tarjeta gráfica, sin repintar) y no
     bloquea los clics. Con «reducir movimiento» no se muestra. -->
<style>
.oc-intro { position: fixed; inset: 0; z-index: 1000000; pointer-events: none; overflow: hidden;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  animation: oc-intro-seguridad .5s ease 2.5s forwards; }
.oc-intro.en-marcha { animation: oc-intro-fuera 3s cubic-bezier(.4, 0, .2, 1) forwards; }
@keyframes oc-intro-seguridad { to { opacity: 0; visibility: hidden; } }
/* la capa no se desvanece entera: el ojo sale solo por arriba y el mar se aclara aparte */
@keyframes oc-intro-fuera {
  0%, 99% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; } }

/* el mar oscuro: se aclara a partir de 1,5 s, cuando el ojo enciende la luz sobre los datos */
/* El mar oscuro es una cortina el doble de alta que la pantalla: oscura arriba, con un borde
   largo y difuminado, y transparente abajo. Al subirla, la página se desvela de abajo arriba
   (solo transform: la mueve la tarjeta gráfica). */
.oc-intro-mar { position: absolute; left: 0; right: 0; top: 0; height: 220%;
  will-change: transform;
  background: linear-gradient(180deg, #01050b 0%, #020b16 22%, #04192b 40%,
    rgba(4, 25, 43, .82) 47%, rgba(4, 25, 43, .45) 53%, rgba(4, 25, 43, .15) 58%,
    transparent 63%); }
.en-marcha .oc-intro-mar { animation: oc-intro-mar 3s cubic-bezier(.45, 0, .3, 1) forwards; }
@keyframes oc-intro-mar {
  0%, 42% { transform: translateY(0); }
  100% { transform: translateY(-64%); } }

/* nieve marina */
.oc-intro-nieve { position: absolute; inset: -10% 0; will-change: transform, opacity;
  background-image:
    radial-gradient(circle, rgba(200, 235, 255, .55) 0 1px, transparent 1.5px),
    radial-gradient(circle, rgba(200, 235, 255, .35) 0 1.5px, transparent 2px);
  background-size: 140px 160px, 230px 260px; background-position: 30px 10px, 110px 80px;
  opacity: 0; }
.en-marcha .oc-intro-nieve { animation: oc-intro-nieve 3s ease-out forwards; }
/* de principio a fin: aparece enseguida y se mantiene hasta que el fondo de la web toma el relevo */
@keyframes oc-intro-nieve {
  0% { opacity: 0; transform: translateY(40px); }
  12%, 88% { opacity: .85; }
  100% { opacity: 0; transform: translateY(-90px); } }

/* luz alrededor del ojo cuando se acerca (en el centro) */
.oc-intro-luz { position: absolute; inset: -25%; will-change: transform, opacity;
  background: radial-gradient(circle at 50% 50%, rgba(175, 230, 255, .3) 0,
    rgba(120, 190, 255, .18) 6vmax, rgba(80, 160, 250, .08) 13vmax, rgba(56, 150, 240, .03) 21vmax,
    transparent 30vmax);
  opacity: 0; transform: scale(.6); }
.en-marcha .oc-intro-luz { animation: oc-intro-luz 3s ease-in-out forwards; }
/* el halo crece poco a poco, al ritmo con que se aclara la página (que se desvela del 42 % al
   100 %), sin encenderse de golpe; se apaga al final, cuando la página ya tiene su propia luz */
@keyframes oc-intro-luz {
  0%, 10% { opacity: 0; transform: scale(.7); }
  42% { opacity: .3; transform: scale(.85); }
  80% { opacity: .75; transform: scale(1.1); }
  100% { opacity: 0; transform: scale(1.25); } }

/* luz del núcleo: el ojo, ya arriba, la enciende y baja sobre la página (como los rayos del
   fondo, que también vienen de arriba) */
.oc-intro-haz { position: absolute; inset: 0; will-change: transform, opacity;
  transform-origin: 50% 2%;
  background:
    radial-gradient(ellipse 60% 100% at 50% 2%, rgba(200, 238, 255, .6) 0,
      rgba(130, 198, 255, .32) 28%, rgba(85, 165, 245, .13) 55%, transparent 82%),
    linear-gradient(180deg, rgba(170, 228, 255, .14), transparent 70%);
  opacity: 0; transform: scaleY(.25); }
.en-marcha .oc-intro-haz { animation: oc-intro-haz 3s cubic-bezier(.3, 0, .2, 1) forwards; }
@keyframes oc-intro-haz {
  0%, 48% { opacity: 0; transform: scaleY(.25); }
  76% { opacity: 1; transform: scaleY(1.1); }
  100% { opacity: 0; transform: scaleY(1.4); } }

/* lienzo del ojo 3D (lo pone app/intro3d.py) */
.oc-intro-3d { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;
  will-change: opacity; }
/* la opacidad del lienzo la lleva app/intro3d.py con el mismo reloj que el ojo: aparece y,
   ya arriba, se desvanece poco a poco (una animación CSS mandaría sobre ella) */

/* ojo plano de reserva: solo si el 3D no carga */
.oc-intro-ojo { display: none; position: relative; width: 190px; height: 190px;
  will-change: transform, opacity; opacity: 0; }
.sin3d .oc-intro-ojo { display: block; }
.oc-intro-ojo > * { position: absolute; inset: 0; width: 100%; height: 100%; }
.oc-intro-bola { border-radius: 50%;
  background: radial-gradient(circle at 50% 55%, #0b2a4d 0%, #061a30 60%, #030d1a 100%);
  box-shadow: 0 0 70px rgba(61, 139, 253, .45), 0 0 140px rgba(56, 189, 248, .22); }
.sin3d.en-marcha .oc-intro-ojo { animation: oc-intro-plano 3s cubic-bezier(.2, .7, .2, 1) forwards; }
.sin3d.en-marcha .oc-intro-iris { animation: oc-intro-gira 3s linear forwards; }
@keyframes oc-intro-plano {
  0% { opacity: 0; transform: translate(0, 12px) scale(.8); }
  30% { opacity: 1; transform: translate(0, 0) scale(1); }
  50% { opacity: 1; transform: translate(0, 0) scale(1.12); }
  100% { opacity: 1; transform: translate(0, -70vh) scale(.5); } }
@keyframes oc-intro-gira {
  from { transform: rotate(0deg); }
  to { transform: rotate(50deg); } }

.oc-intro-nombre { position: absolute; top: calc(50% + 120px); left: 0; right: 0;
  text-align: center; font-family: Inter, sans-serif; font-size: 1.05rem; letter-spacing: .32em;
  text-transform: uppercase; color: #cfe9ff; opacity: 0; will-change: transform, opacity; }
.en-marcha .oc-intro-nombre { animation: oc-intro-nombre 3s ease-out forwards; }
@keyframes oc-intro-nombre {
  0%, 22% { opacity: 0; transform: translateY(8px); }
  38%, 50% { opacity: .9; transform: translateY(0); }
  62%, 100% { opacity: 0; transform: translateY(-6px); } }

/* La página no se anima por separado: la capa va dentro de ella y un transform en la página
   haría que la capa fija dejara de cubrir la pantalla. Se desvela al desvanecerse la capa. */
@media (prefers-reduced-motion: reduce) {
  .oc-intro { display: none; } }
</style>
<div class="oc-intro" aria-hidden="true">
  <div class="oc-intro-mar"></div>
  <div class="oc-intro-nieve"></div>
  <div class="oc-intro-luz"></div>
  <div class="oc-intro-haz"></div>
  <div class="oc-intro-ojo">
    <div class="oc-intro-bola"></div>
    <img class="oc-intro-iris" src="{iris}" alt="">
    <img src="{cristal}" alt="">
  </div>
  <div class="oc-intro-nombre">Ojo Ciudadano</div>
</div>
